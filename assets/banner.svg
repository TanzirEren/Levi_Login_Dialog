<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f17"><animate attributeName="stop-color" values="#0b1f17;#12b76a;#0b1f17" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#12b76a"><animate attributeName="stop-color" values="#12b76a;#5eead4;#12b76a" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <clipPath id="r"><rect width="1000" height="300" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle r="150" fill="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" path="M120,60 C400,260 700,20 900,220 C700,40 400,280 120,60"/></circle>
    <circle r="110" fill="url(#glow)" opacity=".7"><animateMotion dur="11s" repeatCount="indefinite" path="M880,70 C600,10 300,260 100,200 C300,300 600,40 880,70"/></circle>
    <g fill="#fff" opacity=".5">
      <circle cx="140" cy="230" r="3"><animate attributeName="cy" values="260;40;260" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="250" r="2"><animate attributeName="cy" values="270;30;270" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="240" r="3"><animate attributeName="cy" values="270;50;270" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="250" r="2"><animate attributeName="cy" values="270;20;270" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="1" y="1" width="998" height="298" rx="35" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="500" y="150" font-size="96" font-weight="800" fill="#fff" letter-spacing="14">LEVI
        <animate attributeName="y" values="150;140;150" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="205" font-size="26" fill="#eafff4" letter-spacing="4">Firebase-powered login-key dialog + glass admin panel</text>
      <text x="500" y="250" font-size="16" fill="#d1fae5" letter-spacing="6" opacity=".85">TENIx</text>
    </g>
  </g>
</svg>
