name: Build Levi + Levi Admin
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build Levi (dialog)
        run: gradle -p Levi assembleDebug --no-daemon
      - name: Build Levi Admin
        run: gradle -p LeviAdmin assembleDebug --no-daemon
      - name: Check single classes.dex
        run: |
          cp Levi/app/build/outputs/apk/debug/app-debug.apk Levi.apk
          N=$(unzip -l Levi.apk | grep -c 'classes.*\.dex')
          echo "dex files in Levi.apk: $N"
          test "$N" -eq 1
      - uses: actions/upload-artifact@v4
        with: { name: Levi, path: Levi/app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with: { name: Levi-Admin, path: LeviAdmin/app/build/outputs/apk/debug/app-debug.apk }
      - name: Name release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF_NAME}
          cp Levi/app/build/outputs/apk/debug/app-debug.apk "Levi-${TAG}.apk"
          cp LeviAdmin/app/build/outputs/apk/debug/app-debug.apk "Levi-Admin-${TAG}.apk"
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "🌿 Levi ${{ github.ref_name }} — Multi-User Login Keys"
          body_path: RELEASE_NOTES.md
          files: |
            Levi-${{ github.ref_name }}.apk
            Levi-Admin-${{ github.ref_name }}.apk
